<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | Basics Box</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="brand-chip">BB</div>
            <div>
                <h2>Basics Box</h2>
                <p>Inventory System</p>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="../merchant.html" class="nav-item">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="products.html" class="nav-item active">
                <i class="fas fa-box"></i>
                <span>Products</span>
            </a>
            <a href="buy.html" class="nav-item">
                <i class="fas fa-cart-plus"></i>
                <span>Buy Stock</span>
            </a>
            <a href="sell.html" class="nav-item">
                <i class="fas fa-shopping-cart"></i>
                <span>Sell Stock</span>
            </a>
            <a href="reports.html" class="nav-item">
                <i class="fas fa-file-invoice-dollar"></i>
                <span>Reports</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <div class="main-content">

        <header class="top-header">
            <div class="page-heading">
                <h1 class="page-title">Products</h1>
                <p class="page-subtitle">Manage your product catalogue</p>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
                <button class="btn btn-primary" id="addProductBtn">
                    <i class="fas fa-plus"></i> Add Product
                </button>
            </div>
        </header>

        <!-- Products Table -->
        <section class="card">
            <div class="card-header">
                <h3>All Products</h3>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="data-table" id="productsTable">
                        <thead>
                            <tr>
                                <th>SKU</th>
                                <th>Product Name</th>
                                <th>Unit</th>
                                <th>Current Stock</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody">
                            <!-- Products will be loaded here -->
                        </tbody>
                    </table>
                </div>
                <p class="empty-text" id="noProductsMsg">No products found. Click "Add Product" to create one.</p>
            </div>
        </section>

    </div>

    <!-- Add / Edit Product Modal -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Product</h3>
                <button class="modal-close" id="closeModal">&times;</button>
            </div>
            <form id="productForm">
                <input type="hidden" id="productId">
                
                <div class="form-group">
                    <label>SKU *</label>
                    <input type="text" id="sku" placeholder="e.g. BIS-001" required>
                </div>

                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" id="name" placeholder="e.g. Parle-G Biscuits 100g" required>
                </div>

                <div class="form-group">
                    <label>Unit *</label>
                    <select id="unit" required>
                        <option value="">Select Unit</option>
                        <option value="pcs">Pieces (pcs)</option>
                        <option value="pack">Pack</option>
                        <option value="kg">Kilogram (kg)</option>
                        <option value="g">Gram (g)</option>
                        <option value="ltr">Litre</option>
                        <option value="box">Box</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Minimum Stock Level</label>
                    <input type="number" id="minStock" value="0" min="0">
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/storage.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/products.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Basics Box</title>
    <link rel="stylesheet" href="qcommerce-inventory/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-page">

    <main class="auth-wrap">
        <section class="auth-brand">
            <div class="auth-brand-inner">
                <div class="brand-chip large">BB</div>
                <h1>Basics Box</h1>
                <p class="auth-tagline">Inventory & Profit Tracker</p>
                <blockquote class="auth-quote">
                    "Track stock. Watch profit. Grow with confidence."
                </blockquote>
            </div>
        </section>

        <section class="auth-form-side">
            <button class="theme-toggle auth-theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>

            <div class="auth-form-card">
                <h2>Create an account</h2>
                <p class="auth-sub">Register to start using Basics Box</p>

                <form id="registerForm" novalidate>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="name" placeholder="Your full name" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="Your password" required>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                    </div>

                    <button type="submit" class="btn btn-primary auth-submit">
                        <i class="fas fa-user-plus"></i> Register
                    </button>
                </form>

                <p class="auth-switch">
                    Already have an account?
                    <a href="login.html">Login</a>
                </p>
            </div>
        </section>
    </main>

    <script src="qcommerce-inventory/js/storage.js"></script>
    <script src="qcommerce-inventory/js/toast.js"></script>
    <script src="qcommerce-inventory/js/theme.js"></script>
    <script src="qcommerce-inventory/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registerForm');

            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (!name || !email || !password || !confirmPassword) {
                    showToast('Please fill in all fields.', 'error');
                    return;
                }

                if (password !== confirmPassword) {
                    showToast('Passwords do not match.', 'error');
                    return;
                }

                const result = registerUser(name, email, password);
                if (!result.ok) {
                    showToast(result.error, 'error');
                    return;
                }

                localStorage.setItem('qcommerce-user', JSON.stringify(result.user));
                showToast('Registration successful! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'qcommerce-inventory/merchant.html', 800);
            });
        });
    </script>
</body>
</html>
